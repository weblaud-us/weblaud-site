name: Auto Deploy weblaud App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Gate: nothing reaches the VPS unless it typechecks, passes the unit tests,
  # and builds. Previously every push to main deployed unchecked.
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Vite 7 needs ^20.19.0 || >=22.12.0 (see deploy.sh).
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: verify
    # Pull requests only run the checks above.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            export NVM_DIR="/home/deployer/.nvm"
            source "$NVM_DIR/nvm.sh"
            cd /var/www/weblaud-site
            ./deploy.sh
